<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <meta name="description" content="WeParlay - A cutting-edge sports betting platform with cryptocurrency wallet integration, real-time data, and interactive betting experiences" />
    <title>WeParlay - The Future of Sports Betting</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Primary Meta Tags for Search Engines -->
    <meta name="keywords" content="sports betting, cryptocurrency, NFL, NBA, fantasy sports, betting app, WeParlay, UFC, boxing, tennis" />
    <meta name="author" content="WeParlay.io" />
    <meta name="robots" content="index, follow" />
    
    <!-- Open Graph Meta Tags for Facebook and LinkedIn -->
    <meta property="og:title" content="WeParlay - The Future of Sports Betting" />
    <meta property="og:description" content="A cutting-edge sports betting platform with cryptocurrency integration, social features, and interactive tournaments. Join now and get 1,000 WeParlay Cash free!" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://weparlay.io/" />
    <meta property="og:image" content="https://weparlay.io/weparlaylogo4.png" />
    <meta property="og:image:alt" content="WeParlay Logo and Platform Screenshot" />
    <meta property="og:site_name" content="WeParlay" />
    <meta property="og:locale" content="en_US" />
    
    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="WeParlay - Premium Sports Betting Platform" />
    <meta name="twitter:description" content="Discover the next generation of sports betting with WeParlay. Real-time odds, fantasy sports integration, and cryptocurrency support." />
    <meta name="twitter:image" content="https://weparlay.io/weparlaylogo4.png" />
    
    <!-- Apple Touch Icon and Favicon -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png">
    <link rel="icon" href="/favicon.png">
    
    <!-- Color Theme -->
    <meta name="theme-color" content="#3498db" />
    
    <!-- Content Security Policy for Payment Gateways -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' 'unsafe-inline' 'unsafe-eval' 
        https://www.paypal.com 
        https://www.sandbox.paypal.com 
        https://js.stripe.com 
        https://checkout.stripe.com 
        https://www.googletagmanager.com 
        https://replit.com 
        https://cdnjs.cloudflare.com;
      style-src 'self' 'unsafe-inline' 
        https://fonts.googleapis.com 
        https://cdnjs.cloudflare.com;
      font-src 'self' 
        https://fonts.gstatic.com 
        https://cdnjs.cloudflare.com;
      img-src 'self' data: blob: 
        https: 
        http:;
      connect-src 'self' 
        https://api.stripe.com 
        https://www.paypal.com 
        https://api.paypal.com 
        https://www.sandbox.paypal.com 
        https://api-m.sandbox.paypal.com 
        https://www.google-analytics.com 
        https://analytics.google.com;
      frame-src 'self' 
        https://js.stripe.com 
        https://hooks.stripe.com 
        https://www.paypal.com 
        https://www.sandbox.paypal.com;
      object-src 'none';
      base-uri 'self';
    " />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- This is a replit script which adds a banner on the top of the page when opened in development mode outside the replit environment -->
    <script type="text/javascript" src="https://replit.com/public/js/replit-dev-banner.js"></script>
  </body>
</html>
